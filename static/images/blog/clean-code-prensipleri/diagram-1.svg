<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Delivery velocity of a clean codebase versus a messy codebase over time">
  <rect width="1600" height="900" fill="#FAFAF8"/>

  <g font-family="Inter, system-ui, sans-serif">
    <text x="800" y="100" font-size="34" font-weight="800" text-anchor="middle" fill="#18181B">The Cost of Mess Grows Over Time</text>
    <text x="800" y="138" font-size="22" text-anchor="middle" fill="#A16207">Same starting speed. Very different six months later.</text>

    <!-- axes -->
    <line x1="220" y1="200" x2="220" y2="760" stroke="#18181B" stroke-width="2.5"/>
    <line x1="220" y1="760" x2="1460" y2="760" stroke="#18181B" stroke-width="2.5"/>

    <text x="150" y="480" font-size="22" font-weight="700" fill="#18181B" text-anchor="middle" transform="rotate(-90 150 480)">Delivery Velocity</text>
    <text x="840" y="825" font-size="22" font-weight="700" fill="#18181B" text-anchor="middle">Time</text>

    <!-- gridlines -->
    <g stroke="#18181B" stroke-opacity="0.08" stroke-width="1.5">
      <line x1="530" y1="200" x2="530" y2="760"/>
      <line x1="840" y1="200" x2="840" y2="760"/>
      <line x1="1150" y1="200" x2="1150" y2="760"/>
    </g>

    <!-- time markers -->
    <g font-size="19" fill="#A16207" text-anchor="middle">
      <text x="220" y="790">Day 1</text>
      <text x="530" y="790">Month 1</text>
      <text x="840" y="790">Month 3</text>
      <text x="1150" y="790">Month 6</text>
      <text x="1450" y="790">Month 12</text>
    </g>

    <!-- messy line (declines) -->
    <polyline points="220,580 530,660 840,712 1150,742 1450,754" fill="none" stroke="#EAB308" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#EAB308">
      <circle cx="220" cy="580" r="8"/>
      <circle cx="530" cy="660" r="8"/>
      <circle cx="840" cy="712" r="8"/>
      <circle cx="1150" cy="742" r="8"/>
      <circle cx="1450" cy="754" r="8"/>
    </g>

    <!-- clean line (improves / stays strong) -->
    <polyline points="220,600 530,540 840,498 1150,458 1450,418" fill="none" stroke="#18181B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#18181B">
      <circle cx="220" cy="600" r="8"/>
      <circle cx="530" cy="540" r="8"/>
      <circle cx="840" cy="498" r="8"/>
      <circle cx="1150" cy="458" r="8"/>
      <circle cx="1450" cy="418" r="8"/>
    </g>

    <!-- callout at the crossover -->
    <line x1="840" y1="200" x2="840" y2="760" stroke="#A16207" stroke-width="2" stroke-dasharray="6,8" opacity="0.5"/>
    <rect x="900" y="330" width="420" height="86" rx="12" fill="#FAFAF8" stroke="#A16207" stroke-width="2"/>
    <text x="920" y="365" font-size="20" font-weight="700" fill="#18181B">Month 3: the gap</text>
    <text x="920" y="393" font-size="20" font-weight="700" fill="#18181B">becomes impossible to ignore</text>

    <!-- legend -->
    <g font-size="22" font-weight="700">
      <rect x="1000" y="215" width="34" height="12" rx="4" fill="#18181B"/>
      <text x="1046" y="227" fill="#18181B">Clean Codebase</text>
      <rect x="1230" y="215" width="34" height="12" rx="4" fill="#EAB308"/>
      <text x="1276" y="227" fill="#18181B">Messy Codebase</text>
    </g>

    <!-- bottom annotation -->
    <rect x="220" y="820" width="1240" height="0" fill="none"/>
    <text x="800" y="860" font-size="22" font-weight="700" text-anchor="middle" fill="#A16207">Today's shortcut quietly becomes next quarter's debugging marathon.</text>
  </g>
</svg>
