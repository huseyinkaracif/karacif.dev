<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Guarded agent loop flow">
  <rect width="1600" height="900" fill="#FAFAF8"/>

  <g font-family="Inter, system-ui, sans-serif">
    <!-- Row of boxes -->
    <!-- 1 User Input -->
    <rect x="60" y="140" width="220" height="120" rx="12" fill="none" stroke="#18181B" stroke-width="3"/>
    <text x="170" y="195" font-size="24" font-weight="700" text-anchor="middle" fill="#18181B">User</text>
    <text x="170" y="225" font-size="24" font-weight="700" text-anchor="middle" fill="#18181B">Request</text>

    <path d="M280 200 H 340" stroke="#18181B" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- 2 Input Guardrails -->
    <rect x="340" y="140" width="240" height="120" rx="12" fill="#EAB308"/>
    <text x="460" y="195" font-size="24" font-weight="700" text-anchor="middle" fill="#18181B">Input</text>
    <text x="460" y="225" font-size="24" font-weight="700" text-anchor="middle" fill="#18181B">Guardrails</text>

    <path d="M580 200 H 640" stroke="#18181B" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- 3 Agent Loop -->
    <rect x="640" y="120" width="280" height="160" rx="12" fill="none" stroke="#18181B" stroke-width="3"/>
    <text x="780" y="170" font-size="24" font-weight="700" text-anchor="middle" fill="#18181B">Agent Loop</text>
    <text x="780" y="200" font-size="18" text-anchor="middle" fill="#A16207">LLM + Tool Call</text>
    <text x="780" y="228" font-size="18" text-anchor="middle" fill="#A16207">timeout &#183; retry &#183; budget</text>

    <path d="M920 200 H 980" stroke="#18181B" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- 4 Human approval -->
    <rect x="980" y="140" width="260" height="120" rx="12" fill="#EAB308"/>
    <text x="1110" y="195" font-size="22" font-weight="700" text-anchor="middle" fill="#18181B">Human Approval</text>
    <text x="1110" y="223" font-size="16" text-anchor="middle" fill="#18181B" opacity="0.75">if action is risky</text>

    <path d="M1240 200 H 1300" stroke="#18181B" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- 5 Response -->
    <rect x="1300" y="140" width="240" height="120" rx="12" fill="none" stroke="#18181B" stroke-width="3"/>
    <text x="1420" y="195" font-size="24" font-weight="700" text-anchor="middle" fill="#18181B">Output</text>
    <text x="1420" y="225" font-size="24" font-weight="700" text-anchor="middle" fill="#18181B">Guardrails</text>

    <!-- retry loop back arrow from Agent Loop -->
    <path d="M780 280 C 780 340, 630 340, 630 280" fill="none" stroke="#A16207" stroke-width="2.5" stroke-dasharray="6,8" marker-end="url(#arrow-brown)"/>
    <text x="705" y="365" font-size="16" fill="#A16207" text-anchor="middle">tool blocked / retry</text>

    <!-- Observability band -->
    <rect x="60" y="620" width="1480" height="180" rx="16" fill="#18181B"/>
    <text x="800" y="675" font-size="28" font-weight="800" text-anchor="middle" fill="#FAFAF8">Observability &amp; Tracing</text>
    <text x="800" y="710" font-size="18" text-anchor="middle" fill="#FAFAF8" opacity="0.8">every step, every tool call, every token &#8212; logged</text>
    <text x="800" y="740" font-size="18" text-anchor="middle" fill="#EAB308">cost &#183; latency &#183; error rate &#183; session replay</text>

    <!-- dashed connectors from each box down to observability -->
    <g stroke="#18181B" stroke-width="2" stroke-dasharray="3,8" opacity="0.55">
      <line x1="170" y1="260" x2="170" y2="620"/>
      <line x1="460" y1="260" x2="460" y2="620"/>
      <line x1="780" y1="280" x2="780" y2="620"/>
      <line x1="1110" y1="260" x2="1110" y2="620"/>
      <line x1="1420" y1="260" x2="1420" y2="620"/>
    </g>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#18181B"/>
    </marker>
    <marker id="arrow-brown" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#A16207"/>
    </marker>
  </defs>
</svg>
