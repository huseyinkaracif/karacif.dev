<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#FAFAF8"/>

  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#18181B"/>
    </marker>
  </defs>

  <text x="800" y="80" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="800" fill="#18181B" text-anchor="middle">The Gateway MCP Server Pattern</text>

  <!-- AI Agent -->
  <g transform="translate(60,370)">
    <rect width="240" height="140" rx="20" fill="#FFFFFF" stroke="#18181B" stroke-width="3"/>
    <text x="120" y="60" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" fill="#18181B" text-anchor="middle">AI Agent</text>
    <text x="120" y="94" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#71717A" text-anchor="middle">(LLM + tools)</text>
  </g>

  <line x1="300" y1="440" x2="410" y2="440" stroke="#18181B" stroke-width="3" marker-end="url(#arrow1)"/>

  <!-- Gateway -->
  <g transform="translate(430,300)">
    <rect width="380" height="280" rx="24" fill="#18181B"/>
    <text x="190" y="52" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="800" fill="#FAFAF8" text-anchor="middle">Gateway MCP Server</text>
    <rect x="30" y="80" width="150" height="50" rx="10" fill="#EAB308"/>
    <text x="105" y="112" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#18181B" text-anchor="middle">Auth / Scope</text>
    <rect x="200" y="80" width="150" height="50" rx="10" fill="#EAB308"/>
    <text x="275" y="112" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#18181B" text-anchor="middle">Rate Limit</text>
    <rect x="30" y="150" width="150" height="50" rx="10" fill="#EAB308"/>
    <text x="105" y="182" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#18181B" text-anchor="middle">Audit Log</text>
    <rect x="200" y="150" width="150" height="50" rx="10" fill="#EAB308"/>
    <text x="275" y="182" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#18181B" text-anchor="middle">Secrets</text>
    <text x="190" y="245" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#A1A1AA" text-anchor="middle">one checkpoint, one contract</text>
  </g>

  <line x1="810" y1="360" x2="920" y2="230" stroke="#18181B" stroke-width="3" marker-end="url(#arrow1)"/>
  <line x1="810" y1="440" x2="920" y2="440" stroke="#18181B" stroke-width="3" marker-end="url(#arrow1)"/>
  <line x1="810" y1="520" x2="920" y2="650" stroke="#18181B" stroke-width="3" marker-end="url(#arrow1)"/>

  <!-- internal systems -->
  <g font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#18181B" text-anchor="middle">
    <g transform="translate(940,160)">
      <rect width="260" height="90" rx="16" fill="#FFFFFF" stroke="#A16207" stroke-width="3"/>
      <text x="130" y="55">CRM API</text>
    </g>
    <g transform="translate(940,395)">
      <rect width="260" height="90" rx="16" fill="#FFFFFF" stroke="#A16207" stroke-width="3"/>
      <text x="130" y="55">Billing API</text>
    </g>
    <g transform="translate(940,630)">
      <rect width="260" height="90" rx="16" fill="#FFFFFF" stroke="#A16207" stroke-width="3"/>
      <text x="130" y="55">Database</text>
    </g>
  </g>

  <text x="800" y="800" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#71717A" text-anchor="middle">The agent never talks to internal systems directly — only through the gateway.</text>
</svg>
