<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#FAFAF8"/>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#18181B"/>
    </marker>
  </defs>

  <text x="800" y="80" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="800" fill="#18181B" text-anchor="middle">Read-Only vs. Action Tools</text>

  <!-- Tool call -->
  <g transform="translate(90,380)">
    <rect width="240" height="120" rx="20" fill="#FFFFFF" stroke="#18181B" stroke-width="3"/>
    <text x="120" y="52" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" fill="#18181B" text-anchor="middle">Tool Call</text>
    <text x="120" y="82" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#71717A" text-anchor="middle">from the model</text>
  </g>

  <line x1="330" y1="440" x2="430" y2="440" stroke="#18181B" stroke-width="3" marker-end="url(#arrow2)"/>

  <!-- decision diamond -->
  <g transform="translate(440,340)">
    <polygon points="120,0 240,110 120,220 0,110" fill="#EAB308" stroke="#18181B" stroke-width="3"/>
    <text x="120" y="100" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#18181B" text-anchor="middle">kind =</text>
    <text x="120" y="128" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#18181B" text-anchor="middle">read / action?</text>
  </g>

  <!-- read path (top) -->
  <line x1="680" y1="400" x2="800" y2="230" stroke="#18181B" stroke-width="3" marker-end="url(#arrow2)"/>
  <text x="720" y="290" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#18181B">read</text>
  <g transform="translate(810,150)">
    <rect width="260" height="100" rx="18" fill="#FFFFFF" stroke="#A16207" stroke-width="3"/>
    <text x="130" y="45" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#18181B" text-anchor="middle">Execute</text>
    <text x="130" y="75" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#71717A" text-anchor="middle">immediately</text>
  </g>

  <!-- action path (bottom) -->
  <line x1="680" y1="480" x2="800" y2="650" stroke="#18181B" stroke-width="3" marker-end="url(#arrow2)"/>
  <text x="710" y="600" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#18181B">action</text>
  <g transform="translate(810,600)">
    <rect width="280" height="100" rx="18" fill="#18181B"/>
    <text x="140" y="45" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#FAFAF8" text-anchor="middle">Human Approval</text>
    <text x="140" y="75" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#EAB308" text-anchor="middle">required before running</text>
  </g>

  <line x1="1090" y1="650" x2="1180" y2="650" stroke="#18181B" stroke-width="3" marker-end="url(#arrow2)"/>
  <g transform="translate(1190,600)">
    <rect width="200" height="100" rx="18" fill="#FFFFFF" stroke="#A16207" stroke-width="3"/>
    <text x="100" y="45" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#18181B" text-anchor="middle">Execute</text>
    <text x="100" y="75" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#71717A" text-anchor="middle">if approved</text>
  </g>

  <!-- both merge into audit log -->
  <line x1="940" y1="250" x2="1290" y2="600" stroke="#A1A1AA" stroke-width="2.5" stroke-dasharray="6 8" marker-end="url(#arrow2)"/>
  <line x1="1290" y1="700" x2="1290" y2="760" stroke="#A1A1AA" stroke-width="2.5" stroke-dasharray="6 8" marker-end="url(#arrow2)"/>

  <g transform="translate(1050,780)">
    <rect width="480" height="90" rx="18" fill="#FEF9C3" stroke="#A16207" stroke-width="3"/>
    <text x="240" y="52" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" fill="#18181B" text-anchor="middle">Audit Log — who, what, when, result</text>
  </g>
</svg>
